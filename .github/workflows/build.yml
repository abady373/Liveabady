name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.swift'
      - Info.plist
      - 'ArabicLivePhoto.xcodeproj/**'
      - export-unsigned-ipa.sh
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned device IPA
        run: bash export-unsigned-ipa.sh

      - name: Verify IPA package
        shell: bash
        run: |
          set -euo pipefail
          test -s build/IPA/ArabicLivePhoto-unsigned.ipa
          unzip -t build/IPA/ArabicLivePhoto-unsigned.ipa
          unzip -Z1 build/IPA/ArabicLivePhoto-unsigned.ipa | grep -Fx 'Payload/ArabicLivePhoto.app/ArabicLivePhoto'
          xcrun lipo -archs build/Device/Build/Products/Release-iphoneos/ArabicLivePhoto.app/ArabicLivePhoto

      - name: Upload IPA
        id: ipa
        uses: actions/upload-artifact@v4
        with:
          name: ArabicLivePhoto-unsigned-IPA
          path: build/IPA/ArabicLivePhoto-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Add download link to summary
        env:
          ARTIFACT_URL: ${{ steps.ipa.outputs.artifact-url }}
        run: |
          printf '### Unsigned iPhone IPA\n\n[Download the IPA artifact](%s)\n\nExtract the downloaded ZIP, then sign the IPA in ESign before installation.\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
